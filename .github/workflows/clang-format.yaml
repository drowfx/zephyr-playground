name: Check formatting

on:
  pull-request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-format:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:main
    steps:
      - name: Apply container owner mismatch workaround
        run: |
          # FIXME: The owner UID of the GITHUB_WORKSPACE directory may not
          #        match the container user UID because of the way GitHub
          #        Actions runner is implemented. Remove this workaround when
          #        GitHub comes up with a fundamental fix for this problem.
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - uses: actions/checkout@v4
      - run: |
          git diff -U0 --no-color --relative  ${{ github.event.pull_request.base.ref }} -- | clang-format-diff-16 -p 1 -style=file -i
      - name: Suggest Changes Action
        uses: parkerbxyz/suggest-changes@v2.0.0
